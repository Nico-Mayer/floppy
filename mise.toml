[shell_alias]
mr = "mise run"

# https://v2.tauri.app/de/start/prerequisites/
[env]
# FLOPPY_BROKER=local points quick share at `mise run broker`.
FLOPPY_BROKER_URL = "{% if env.FLOPPY_BROKER | default(value='remote') == 'local' %}ws://127.0.0.1:8787/ws{% else %}wss://floppy-broker.up.railway.app/ws{% endif %}"
FLOPPY_BROKER_ADDR = ":8787"
FLOPPY_TEST_BROKER = "{{ env.FLOPPY_BROKER_URL }}"

[tools]
node = "26.5.0"
java = { version = "temurin-21", os = ["macos", "linux"] }
ruby = { version = "4.0.6", os = ["macos"] }
cocoapods = { version = "1.17", os = ["macos"] }
rust = { version = "1.98", profile = "default", postinstall = 'rustup default "$RUSTUP_TOOLCHAIN"' }
"npm:@fission-ai/openspec" = "1.6.0"
"npm:commit-and-tag-version" = "13.2.1"
go = "1.26"

# --- dev ---

[tasks.dev]
description = "Tauri desktop dev (Vite on :1420)"
run = "npm run tauri dev"

[tasks."dev:android"]
description = "Tauri Android dev on a connected device/emulator"
run = "npm run tauri android dev"

[tasks."dev:ios"]
description = "Tauri iOS dev on a connected device/simulator"
run = "npm run tauri ios dev"

# --- emulator (no Android Studio needed) ---

[tasks."avd:list"]
description = "List the Android AVDs this machine has"
run = "emulator -list-avds"

[tasks."avd:start"]
description = "Boot an Android AVD"
usage = '''
arg "[avd]" {
  help "AVD name"
  default "Pixel_9_Pro"
}
flag "--headless" help="Run without an emulator window"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=()
[ "${usage_headless:-false}" = "true" ] && args+=("-no-window")
emulator "@${usage_avd}" "${args[@]}"
'''

[tasks."avd:stop"]
description = "Kill the running emulator"
run = "adb emu kill"

[tasks."avd:create"]
description = "Create an Android AVD from the installed API-37 system image"
usage = '''
arg "[avd]" {
  help "AVD name"
  default "Pixel_9_Pro"
}
'''
run = "avdmanager create avd --force -n \"$usage_avd\" -d pixel_9_pro -k 'system-images;android-37.1;google_apis_playstore_ps16k;arm64-v8a'"

[tasks.broker]
description = "Run the Go rendezvous broker locally (pair with FLOPPY_BROKER=local)"
dir = "broker"
run = "go run ."

[tasks."kill-port"]
description = "Free the Vite dev port when a dev run leaks it"
run = '''
#!/usr/bin/env bash
pids="$(lsof -ti tcp:1420)"
[ -z "$pids" ] && exit 0
kill $pids
sleep 1
remaining="$(lsof -ti tcp:1420)"
[ -z "$remaining" ] || kill -9 $remaining
'''
run_windows = "Stop-Process -Id (Get-NetTCPConnection -LocalPort 1420 -State Listen).OwningProcess -Force"

# --- build ---

[tasks.build]
description = "Bundle the desktop app for this OS"
run = "npm run tauri build"

[tasks."build:android"]
description = "Build the Android APK/AAB"
run = "npm run tauri android build"

[tasks."build:ios"]
description = "Build the iOS app"
run = "npm run tauri ios build"

# --- release ---

[tasks.release]
description = "Bump version from conventional commits, write CHANGELOG.md, tag, push. Flags pass through: -- --dry-run, -- --release-as minor"
run = '''
#!/usr/bin/env bash
set -euo pipefail
branch="$(git branch --show-current)"
[ "$branch" = "main" ] || { echo "release: on '$branch', switch to main first" >&2; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "release: working tree is not clean" >&2; exit 1; }
commit-and-tag-version "$@"
case " $* " in *" --dry-run "*) exit 0 ;; esac
git push --follow-tags origin main
'''

# --- check ---

[tasks.lint]
description = "Prettier check + ESLint + clippy"
run = ["npm run lint", "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets"]

[tasks.check]
description = "svelte-check against tsconfig"
run = "npm run check"

[tasks.bindings]
description = "Regenerate src/lib/ipc/bindings.ts from the Rust command/event surface"
dir = "src-tauri"
run = "cargo test export_bindings"

# --- test ---

[tasks."test:rust"]
description = "Rust unit + hermetic transport tests"
dir = "src-tauri"
run = "cargo test"

[tasks."test:go"]
description = "Broker tests"
dir = "broker"
run = "go test -race ./..."

[tasks.test]
description = "Rust + broker tests"
depends = ["test:rust", "test:go"]

[tasks.verify]
description = "Run all offline quality gates"
depends = ["check", "lint", "test"]

[tasks."test:live"]
description = "Live cross-language E2E against FLOPPY_TEST_BROKER"
dir = "src-tauri"
run = "cargo test -- --ignored"

# --- toolchain ---

[tasks.doctor]
description = "Verify the Tauri dev toolchain for this OS"
run = '''
case "$(uname -s)" in
  Darwin) ./scripts/doctor-macos.sh ;;
  Linux) ./scripts/doctor-linux.sh ;;
  *) echo "unsupported platform: $(uname -s)" >&2; exit 1 ;;
esac
'''
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/doctor-windows.ps1"
