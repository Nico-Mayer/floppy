[tools]
go = "latest"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "3.0.0-alpha2.117"
node = "26.5.0"

[shell_alias]
mr = "mise run"

[env]
# Set by `wails3 dev` for its child tasks; default for standalone runs.
WAILS_VITE_PORT = "{{ get_env(name='WAILS_VITE_PORT', default='9245') }}"

[tasks.dev]
description = "Run the application in development mode"
run = "wails3 dev -config ./build/config.yml -port 9245"

[tasks.build]
description = "Build the application"
depends = ["frontend:build"]
run = "go build -o bin/bibor ."
run_windows = "go build -o bin/bibor.exe ."

[tasks.run]
description = "Build and run the application"
depends = ["build"]
run = "./bin/bibor"
run_windows = 'bin\bibor.exe'

[tasks."generate:bindings"]
description = "Generate TypeScript bindings for the Go services"
run = "wails3 generate bindings -clean=true -ts"

[tasks."frontend:build"]
description = "Install deps and build the frontend"
depends = ["generate:bindings"]
dir = "frontend"
run = ["npm install", "npm run build"]

# Helpers below are invoked by `wails3 dev` (wired up in build/config.yml).

[tasks."frontend:dev"]
hide = true
dir = "frontend"
run = ["npm install", 'npm run dev -- --port "$WAILS_VITE_PORT" --strictPort']
run_windows = [
  "npm install",
  "npm run dev -- --port %WAILS_VITE_PORT% --strictPort"
]

[tasks."run:dev"]
hide = true
run = "./bin/bibor"
run_windows = 'bin\bibor.exe'
