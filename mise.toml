[shell_alias]
mr = "mise run"

[env]
# Android SDK/NDK paths differ per OS. iOS builds don't use these.
JAVA_HOME = "{% if os() == 'windows' %}C:\\Program Files\\Android\\Android Studio\\jbr{% else %}/Applications/Android Studio.app/Contents/jbr/Contents/Home{% endif %}"
ANDROID_HOME = "{% if os() == 'windows' %}{{env.LOCALAPPDATA}}\\Android\\Sdk{% else %}{{env.HOME}}/Library/Android/sdk{% endif %}"
NDK_HOME = "{% if os() == 'windows' %}{{env.LOCALAPPDATA}}\\Android\\Sdk\\ndk\\30.0.15729638{% else %}{{env.HOME}}/Library/Android/sdk/ndk/30.0.15729638{% endif %}"
# FLOPPY_BROKER=local runs against `mise run broker` instead of the hosted one.
FLOPPY_BROKER_URL = "{% if env.FLOPPY_BROKER | default(value='remote') == 'local' %}ws://127.0.0.1:8787/ws{% else %}wss://floppy-broker.up.railway.app/ws{% endif %}"
FLOPPY_BROKER_ADDR = ":8787"
FLOPPY_TEST_BROKER = "{{ env.FLOPPY_BROKER_URL }}"

[tools]
node = "26.5.0"
ruby = { version = "4.0.6", os = ["macos"] }
cocoapods = { version = "latest", os = ["macos"] }
rust = { version = "latest", profile = "default", postinstall = """
# Android targets (both OSes). iOS targets are added by `mise run doctor` on macOS.
rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
# Pin the mise-managed toolchain as the global rustup default. mise activates rust
# via RUSTUP_TOOLCHAIN, which only exists inside a mise shell. Builds that run
# outside it -- Xcode's "Build Rust Code" phase for `tauri ios dev`, Gradle's cargo
# invocation for `tauri android` -- strip that env and fall back to `rustup default`.
# If the default is stale/broken, `rustc -vV` yields no output and tauri panics
# (PhaseScriptExecution failed). Pinning keeps a bare `rustc` working everywhere.
rustup default "$RUSTUP_TOOLCHAIN"
""" }
"npm:@fission-ai/openspec" = "1.6.0"
go = "latest"

# --- dev ---

[tasks.dev]
description = "Tauri desktop dev (Vite on :1420)"
run = "npm run tauri dev"

[tasks."dev:android"]
description = "Tauri Android dev on a connected device/emulator"
run = "npm run tauri android dev"

[tasks."dev:ios"]
description = "Tauri iOS dev on a connected device/simulator"
run = "npm run tauri ios dev"

[tasks.broker]
description = "Run the Go rendezvous broker locally (pair with FLOPPY_BROKER=local)"
dir = "broker"
run = "go run ."

[tasks."kill-port"]
description = "Free the Vite dev port when a dev run leaks it"
run = "lsof -ti tcp:1420 | xargs kill -9"
run_windows = "Stop-Process -Id (Get-NetTCPConnection -LocalPort 1420 -State Listen).OwningProcess -Force"

# --- build ---

[tasks.build]
description = "Bundle the desktop app for this OS"
run = "npm run tauri build"

[tasks."build:android"]
description = "Build the Android APK/AAB"
run = "npm run tauri android build"

[tasks."build:ios"]
description = "Build the iOS app"
run = "npm run tauri ios build"

# --- check ---

[tasks.fmt]
description = "Format the frontend with Prettier"
run = "npm run format"

[tasks.lint]
description = "Prettier check + ESLint + clippy"
run = [
  "npm run lint",
  "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets"
]

[tasks.check]
description = "svelte-check against tsconfig"
run = "npm run check"

[tasks.bindings]
description = "Regenerate src/lib/ipc/bindings.ts from the Rust command/event surface"
dir = "src-tauri"
run = "cargo test export_bindings"

# --- test ---

[tasks."test:rust"]
description = "Rust unit + hermetic transport tests"
dir = "src-tauri"
run = "cargo test"

[tasks."test:go"]
description = "Broker tests"
dir = "broker"
run = "go test -race ./..."

[tasks.test]
description = "Full offline gate: Rust + broker"
depends = ["test:rust", "test:go"]

[tasks."test:live"]
description = "Live cross-language E2E against FLOPPY_TEST_BROKER"
dir = "src-tauri"
run = "cargo test -- --ignored"

# --- toolchain ---

[tasks.doctor]
description = "Verify the Tauri dev toolchain for this OS"
run = "./scripts/doctor-macos.sh"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/doctor-windows.ps1"
