schema: spec-driven

context: |
  floppy — cross-platform (desktop + mobile) file-transfer app built on iroh.

  Tech stack:
  - Core: Rust + Tauri 2 in `src-tauri/` (commands, events, iroh transport)
  - Frontend: SvelteKit (adapter-static, SPA fallback) + Svelte 5 runes
    (`$state`, `$derived`, `$props`, `$effect`) in `src/`
  - UI / Frontend: shadcn-svelte first; animated variants from https://v-animations.vercel.app use the available shadcn-svelte and svelte skills before implementing stuff
  - Broker: small Go service in `broker/` (the only Go left), deployed via
    `broker/Dockerfile` (railway.json)
  - Transfer: iroh + iroh-blobs (QUIC, hole-punching, relay fallback, BLAKE3
    content addressing). croc/Wails/Go app-core are gone.

  Layout:
  - `src-tauri/src/lib.rs` — Tauri app wiring: commands, plugins, the `thumb://`
    preview protocol, deep-link routing, Manager/PairingService construction.
  - `src-tauri/src/events.rs` — the event vocabulary (typed structs).
  - `src-tauri/src/transport/` — transfer core: `Manager` (iroh endpoint +
    blob store), error taxonomy, progress/rate tracking. Reports through an
    injected `Emitter`; no Tauri imports in the core types.
  - `src-tauri/src/rendezvous/` — quick share: `code` (phrase gen/normalize),
    `pake` (SPAKE2 + AEAD-sealed ticket), `client` (broker WebSocket mailbox).
  - `src-tauri/src/pairing/` — trusted devices: Ed25519 identity, X25519 kex,
    trust store, signed offers, SAS, one-sided pair links, `PairingService`.
  - `src-tauri/src/preview.rs` — image thumbnails via the `image` crate.
  - `broker/` — Go broker: `/ws` code mailbox (quick share), `/fp` fingerprint
    routing (trusted devices), `/health`.
  - `src/lib/ipc/` — `bindings.ts` is generated by tauri-specta (never hand-edited);
    `index.ts` re-exports it and wraps each command so a failed `Result` throws.

  IPC contract (generated, never hand-written):
  - Commands and events are declared once in `specta_builder()` (lib.rs) and
    exported to `src/lib/ipc/bindings.ts`. Regenerated on every debug build and
    by `cargo test export_bindings`; the checked-in file is the artifact.
  - Commands: `send`, `receive`, `cancel_send`, `cancel_receive`, `quick_share`,
    `describe`, `open_path`, `identity`, `trusted_devices`, `preview_pairing`,
    `trust`, `untrust`, `create_pair_link`, `open_pair_link`, `accept`,
    `decline`, `send_to`.
  - Events (struct name → wire name → `events.<camelCase>`): `CodeEvent`,
    `ProgressEvent`, `DoneEvent`, `ErrorEvent`, `PairingOfferEvent`,
    `PairingAccepted`, `PairingDeclined`, `PairingPaired`, `PairingError`,
    `DeepLink`. Send/receive share one event each, distinguished by
    `kind: "send" | "receive"` (the old split `croc:send:*`/`croc:recv:*` names
    are gone). Every transfer payload carries `id` and `kind`.
  - File picking uses `@tauri-apps/plugin-dialog` from the frontend; drag-drop
    uses native webview events — neither is an app command/event.

  Transfer (iroh):
  - Send is passive: files are imported into the blob store as a collection, a
    ticket is handed out, and the iroh Router serves fetches. Send progress comes
    from the provider event stream (`RequestMode::NotifyLog`) — no polling, no race.
  - Receive is an owned task: connect → verified size → fetch with iroh's native
    progress stream → export files. Cancel drops the task (prompt QUIC reset) and
    emits **no** terminal event.
  - Resume is by BLAKE3 hash from the on-disk store; there is no per-code folder
    and no process-CWD ownership (both were croc-era rules).
  - Destination: `dest_root/<ticket-hash-prefix>/`; the app uses `~/Downloads/floppy`.
  - One send and one receive may run concurrently, never two of the same kind.
  - Sentinel `StartError` text is frontend contract (`errors.ts` matches on it) —
    keep stable: "transfer already running", "previous transfer still stopping",
    "no files selected", "invalid code phrase". Mid-transfer failures emit an
    `ErrorEvent` with a machine-readable `TransferErrorCode` plus user text.

  Rendezvous:
  - Quick share: code phrase `<4 digits>-<word>-<word>-<word>`; the digits pick
    the broker mailbox room, the words are the SPAKE2 password. The sender's
    iroh NodeId is bound into the PAKE-keyed sealed payload — load-bearing, the
    broker is a dumb relay and is not trusted.
  - Trusted devices: the NodeId/ticket rides inside the Ed25519-signed offer,
    verified against the stored device key before dialing.
  - Broker URL: `FLOPPY_BROKER_URL` (default `ws://127.0.0.1:8787/ws`); the
    fingerprint endpoint is derived by swapping `/ws` → `/fp`.

  Tests:
  - Rust gate: `cargo test` in `src-tauri/` — unit + hermetic transport tests
    (`RelayConfig::DisableRelay`, loopback bind, in-memory store; no network).
  - Broker gate: `go test -race ./...` in `broker/`.
  - Live cross-language E2E is `#[ignore]`d; run with a real Go broker at
    `FLOPPY_TEST_BROKER` (e.g. `ws://127.0.0.1:8799/ws`).

  Dev:
  - `mise run dev` (= `npm run tauri dev`); Vite on port 1420.
  - `mise run doctor` checks the per-OS mobile toolchain (Android SDK/NDK, iOS).
  - The browser tab at :1420 is UI preview only — `invoke()`/`listen()` do not
    work there; anything touching commands must run in the native window or
    Rust tests.

