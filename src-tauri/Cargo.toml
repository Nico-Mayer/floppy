[package]
name = "floppy"
version = "0.1.0"
edition = "2021"
description = "Send files straight to another device."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "floppy_lib"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom", "rand_core"] }
# Local wall-clock for the datetime-stamped receive folder. `clock` pulls in
# `Local::now`; no default `oldtime`/serde weight.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.33"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
image = {
  version = "0.25.10",
  default-features = false,
  features = ["gif", "jpeg", "png"]
}
iroh = "1.0.3"
iroh-blobs = "0.103.0"
n0-future = "0.3.2"
percent-encoding = "2.3.2"
# rustls needs a process-wide default crypto provider before the first TLS
# client is built (broker WS, iroh relay). Desktop had one installed
# transitively; a mobile build does not, so `run()` installs ring explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
spake2 = "0.4.0"
specta = "2.0.0-rc"
specta-typescript = "0.0"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = "2.9.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
# Only what floppy uses: the multi-thread runtime, `spawn`/`select!`/`join!`,
# TCP for the broker socket, and timeouts. `full` also pulls process, signal and
# fs drivers into every mobile binary for nothing.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = {
  version = "0.30.0",
  features = ["rustls-tls-webpki-roots"]
}
tokio-util = "0.7.19"
# `log` makes every `tracing::` macro fall back to emitting a `log` record when
# no tracing Subscriber is installed — which is how they reach the log plugin's
# sinks (stdout/logcat/oslog + a log file). Deliberately no Subscriber: adding
# one would capture the events and silence the fallback. Cargo unifies the
# feature, so iroh's tracing output arrives the same way.
tracing = { version = "0.1.44", features = ["log"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# iOS only, but the crate is a no-op elsewhere on mobile, so one target gate
# covers both phones and keeps it out of every desktop build. See `run()`.
#
# Haptics is mobile-only too: the frontend gates every call on a coarse pointer
# and swallows failures, so a desktop build simply has no plugin to call.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-ios-webview-insets = "0.1"
tauri-plugin-haptics = "2"

# Android only: write received files into the public Downloads collection
# (scoped storage has no plain path). Pinned — the API used (`public_storage`,
# `create_new_file_with_pending`, `open_file_writable`) is small but the crate
# moves fast. See `android_publish` in `lib.rs`.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "=29.0.0"

# Desktop only: a phone has one instance by construction. Without this, opening
# a `floppy://` link on Windows/Linux starts a *second* process — the URL goes to
# a new window while the one in front shows nothing, and the new process fights
# the first for the blob store in app data. The `deep-link` feature hands the URL
# to the running instance instead of dropping it. See `run()`.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
